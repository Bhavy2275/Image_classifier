name: VisionAI CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  # ── Python backend ──────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff (non-blocking)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check app/

      - name: Type-check with mypy (non-blocking)
        continue-on-error: true
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports --exclude 'training'

      - name: Run tests
        continue-on-error: true
        env:
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_ANON_KEY: "mock-key"
          SUPABASE_SERVICE_ROLE_KEY: "mock-service-key"
          SUPABASE_JWT_SECRET: "mock-jwt-secret"
          CLOUDINARY_CLOUD_NAME: "mock-cloud"
          CLOUDINARY_API_KEY: "mock-api-key"
          CLOUDINARY_API_SECRET: "mock-secret"
          REDIS_URL: "redis://localhost:6379/0"
          ONNX_MODEL_PATH: "model_cache/test.onnx"
          TOP_K: "5"
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short

  # ── Next.js frontend ────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint --workspace=web

      - name: Type-check (non-blocking)
        continue-on-error: true
        run: npm run type-check --workspace=web

      - name: Build
        run: npm run build --workspace=web
